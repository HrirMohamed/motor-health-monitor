<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Détails de l'inspection</title>

    <link rel="stylesheet" href="../css/common.css">
    

</head>

<body>

<header class="header">

    <h1>Détails de l'inspection</h1>

</header>

<main class="details-container">

    <!-- ======================================= -->
    <!-- INFORMATIONS DU MOTEUR -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Informations du moteur</h2>

        <div id="motorInfo"></div>

    </div>

    <!-- ======================================= -->
    <!-- INFORMATIONS DE L'INSPECTION -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Informations de l'inspection</h2>

        <div id="inspectionInfo"></div>

    </div>

    <!-- ======================================= -->
    <!-- TEMPÉRATURE -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Analyse de la température</h2>

        <div id="temperatureInfo"></div>

    </div>

    <!-- ======================================= -->
    <!-- VIBRATION -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Analyse des vibrations</h2>

        <div id="vibrationInfo"></div>

    </div>

    <!-- ======================================= -->
    <!-- VITESSE -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Analyse de la vitesse de rotation</h2>

        <div id="speedInfo"></div>

    </div>

    <!-- ======================================= -->
    <!-- COURANT -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Mesures des courants</h2>

        <div id="currentInfo"></div>

    </div>

    <!-- ======================================= -->
    <!-- RÉSISTANCE -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Mesures des résistances</h2>

        <div id="resistanceInfo"></div>

    </div>

    <!-- ======================================= -->
    <!-- DIAGNOSTIC -->
    <!-- ======================================= -->

    <div class="card">

        <h2>Diagnostic final</h2>

        <div id="diagnosisInfo"></div>

    </div>

</main>

<footer class="footer">

    <button id="backHistory">

        ← Retour à l'historique

    </button>

    <button id="exportPDF">

        Exporter en PDF

    </button>

</footer>

<script src="../js/details.js"></script>

</body>

</html>
